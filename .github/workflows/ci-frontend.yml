name: Web Frontend CI/CD

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'web-frontend/**'
      - 'docker-compose.yml'
  push:
    branches: [main]
    paths:
      - 'web-frontend/**'
      - 'docker-compose.yml'

defaults:
  run:
    working-directory: web-frontend

env:
  NODE_VERSION: '20'

jobs:
  # ---------- 1. 代码规范 + 单元测试 + 构建 ----------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Upload coverage (for SonarQube job)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: web-frontend/coverage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web-frontend/dist

  # ---------- 2. 安全与代码质量扫描（SonarQube + Snyk） ----------
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube 需要完整git历史做增量分析

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: web-frontend/coverage

      # SonarQube 还没配置好之前（缺 SONAR_TOKEN/SONAR_HOST_URL），这两步会被跳过而不是让 job 失败，
      # 不会阻塞后面的部署。等 SonarQube 服务器就绪、在仓库 Secrets 里填好这两个值后，
      # 这两步会自动开始生效，不需要再改这个文件。
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v3
        with:
          projectBaseDir: web-frontend

      - name: SonarQube Quality Gate check
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5

      - name: SonarQube skipped notice
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "::notice::SONAR_TOKEN/SONAR_HOST_URL 尚未配置，本次跳过 SonarQube 扫描（临时状态，待 SonarQube 服务器就绪后配置 Secrets 即可自动启用）。"

      - name: Snyk dependency vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        # 依赖或代码存在 high/critical 漏洞时，此步骤会以非零状态退出，
        # 从而使该 job 失败，阻止 PR 合并（需在分支保护规则中设为必需检查）。

  # ---------- 3. 验证 Docker 镜像可构建（仅限 main 分支） ----------
  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: web-frontend
          push: false
          tags: expense-hub-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 4. 部署到已配置好的服务器 ----------
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: expense-hub-production
      cancel-in-progress: false
    steps:
      - name: SSH deploy - update source and rebuild frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/expense-hub
            git pull --ff-only origin main
            docker compose up -d --build web-frontend
            docker compose ps
