name: Web Frontend CI/CD

permissions:
  contents: read
  security-events: write
  actions: write # required for cache save (otherwise cache is read-only)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'web-frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'web-frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-frontend.yml'

defaults:
  run:
    working-directory: web-frontend

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # Stage 1: Build & Automated Testing
  # ============================================================
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: web-frontend/coverage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web-frontend/dist

  # ============================================================
  # Stage 2a: Secret Scanning (secure coding practice)
  # Catches credentials/API keys/tokens accidentally committed,
  # including in past commits — not just the current diff.
  # ============================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown
          fail: true

  # ============================================================
  # Stage 2b: SAST — CodeQL
  # ============================================================
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ============================================================
  # Stage 2c: Dependency Vulnerability Scan
  # ============================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Snyk dependency vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # GitHub Actions do not apply defaults.run.working-directory to action steps.
          # Point Snyk at the frontend manifest explicitly.
          args: --file=web-frontend/package.json --severity-threshold=high

  # ============================================================
  # Stage 3: Docker Build + Container Image Scan
  # ============================================================
  docker-build:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: [codeql, dependency-scan, secret-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true — build locally so Trivy can scan it before it goes anywhere
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: web-frontend
          push: false
          load: true
          tags: expense-hub-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy DB is large (~940MB); cache it so we don't re-download every run.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/trivy
          key: cache-trivy-data-${{ runner.os }}-v1
          restore-keys: cache-trivy-data-${{ runner.os }}-

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: expense-hub-web:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: '1' # fail the build on unremediated CRITICAL CVEs
          cache: 'false'
          cache-dir: .cache/trivy

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/trivy
          key: cache-trivy-data-${{ runner.os }}-v1

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================
  # Stage 4: Deploy (main branch only, after image passes scan)
  # ============================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: dast
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: expense-hub-production
      cancel-in-progress: false
    steps:
      - name: SSH deploy - update source and rebuild frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/huangqianer/ADprojectWeb
            git pull --ff-only origin main
            docker compose up -d --build web-frontend
            docker compose ps

  # ============================================================
  # Stage 5: DAST — Dynamic Application Security Testing (OWASP ZAP)
  # The frontend image is a static React site served by nginx. Build it,
  # run it, wait for it to serve, then run a ZAP baseline scan against the
  # live site. Catches runtime-only issues a static site still has:
  # missing security headers (CSP, X-Frame-Options, X-Content-Type-
  # Options), cookie flags, and information disclosure.
  #
  # Non-blocking: baseline findings are for review, not a gate.
  # ============================================================
  dast:
    name: DAST (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: web-frontend
          push: false
          load: true
          tags: expense-hub-web:dast
          cache-from: type=gha

      - name: Start frontend container
        run: |
          docker run -d --name frontend-dast -p 8080:80 expense-hub-web:dast

      - name: Wait for site to serve
        run: |
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              echo "Frontend is serving"; exit 0
            fi
            echo "waiting for frontend... ($i/24)"; sleep 5
          done
          echo "Frontend failed to serve — dumping logs:"
          docker logs frontend-dast
          exit 1

      - name: OWASP ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080/'
          # fail_action:false => warnings are reported but do NOT fail the job.
          # allow_issue_writing:false => don't auto-open GitHub issues.
          fail_action: false
          allow_issue_writing: false

      - name: Show frontend logs (always)
        if: always()
        run: docker logs frontend-dast || true

      - name: Stop frontend container
        if: always()
        run: docker rm -f frontend-dast || true
