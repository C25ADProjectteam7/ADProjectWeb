name: Web Backend CI/CD

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'web-backend/**'
  push:
    branches: [main]
    paths:
      - 'web-backend/**'

defaults:
  run:
    working-directory: web-backend

jobs:
  # ---------- 1. 编译 + 单元测试 + 打包 ----------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests (H2 in-memory DB, 'test' profile)
        run: mvn -B test

      - name: Package jar
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: web-backend/target/*.jar

      - name: Upload jacoco report (for SonarQube job)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: web-backend/target/site/jacoco

  # ---------- 2. 安全与代码质量扫描（SonarQube + Snyk） ----------
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Download jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: web-backend/target/site/jacoco

      # SonarQube 还没配置好之前跳过，不阻塞后面的部署。
      # 等 SonarQube 服务器就绪、在仓库 Secrets 里填好 SONAR_TOKEN/SONAR_HOST_URL 后自动生效。
      - name: SonarQube Scan (Maven)
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube skipped notice
        if: ${{ secrets.SONAR_TOKEN == '' || secrets.SONAR_HOST_URL == '' }}
        run: echo "::notice::SONAR_TOKEN/SONAR_HOST_URL 尚未配置，本次跳过 SonarQube 扫描（临时状态）。"

      - name: Snyk dependency vulnerability scan (Maven)
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=web-backend/pom.xml
        # high/critical 漏洞会让此步骤非零退出，job 失败，从而阻止合并
        # （需在分支保护规则中把本 job 设为 required status check）

  # ---------- 3. 构建并推送 Docker 镜像（仅限 main 分支） ----------
  docker-build-push:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: web-backend
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/expense-hub-backend:latest
            ${{ secrets.REGISTRY_URL }}/expense-hub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 4. 部署到已配置好的服务器 ----------
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: SSH deploy - pull latest image and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/expense-hub
            docker compose pull web-backend
            docker compose up -d web-backend
            docker compose ps
