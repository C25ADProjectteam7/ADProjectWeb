name: Web Backend CI/CD

permissions:
  contents: read
  security-events: write
  actions: write # required for cache save (otherwise cache is read-only)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'web-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'web-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'

defaults:
  run:
    working-directory: web-backend

jobs:
  # ============================================================
  # Stage 1: Build & Automated Testing
  # ============================================================
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests (H2 in-memory DB, 'test' profile)
        run: mvn -B test

      - name: Package jar
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: web-backend/target/*.jar

      - name: Upload jacoco report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: web-backend/target/site/jacoco

  # ============================================================
  # Stage 2a: Secret Scanning (secure coding practice)
  # Catches credentials/API keys/tokens accidentally committed,
  # including in past commits — not just the current diff.
  # ============================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown

  # ============================================================
  # Stage 2b: SAST — CodeQL
  # ============================================================
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      # CodeQL needs an actual compiled build to analyze Java bytecode/AST.
      - name: Build for CodeQL
        run: mvn -B compile -DskipTests

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  # ============================================================
  # Stage 2c: Dependency Vulnerability Scan
  # ============================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Run the CLI on the GitHub runner so Maven uses the JDK configured above.
      # The Docker-based snyk/actions/maven action receives the runner's JAVA_HOME,
      # whose host path is invalid inside its container.
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk dependency vulnerability scan (Maven)
        run: snyk test --severity-threshold=high --file=pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ============================================================
  # Stage 3: Docker Build + Container Image Scan
  # ============================================================
  docker-build:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: [codeql, dependency-scan, secret-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true — build locally so Trivy can scan it before it goes anywhere
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: web-backend
          push: false
          load: true
          tags: expense-hub-backend:ci-${{ github.sha }}
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy DB is large (~940MB); cache it so we don't re-download every run.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/trivy
          key: cache-trivy-data-${{ runner.os }}-v1
          restore-keys: cache-trivy-data-${{ runner.os }}-

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: expense-hub-backend:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: '1' # fail the build on unremediated CRITICAL CVEs
          cache: 'false'
          cache-dir: .cache/trivy

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/trivy
          key: cache-trivy-data-${{ runner.os }}-v1

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================
  # Stage 4: Deploy (main branch only, after image passes scan)
  # ============================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: expense-hub-production
      cancel-in-progress: false
    steps:
      - name: SSH deploy - update source and rebuild backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/huangqianer/ADprojectWeb
            git pull --ff-only origin main
            docker compose up -d --build web-backend
            docker compose ps
