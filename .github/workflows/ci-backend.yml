name: Web Backend CI/CD

permissions:
  contents: read
  security-events: write
  actions: write # required for cache save (otherwise cache is read-only)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'web-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'web-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'

defaults:
  run:
    working-directory: web-backend

jobs:
  # ============================================================
  # Stage 1: Build & Automated Testing
  # ============================================================
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests (H2 in-memory DB, 'test' profile)
        run: mvn -B test

      - name: Package jar
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: web-backend/target/*.jar

      - name: Upload jacoco report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: web-backend/target/site/jacoco

  # ============================================================
  # Stage 2a: Secret Scanning (secure coding practice)
  # Catches credentials/API keys/tokens accidentally committed,
  # including in past commits — not just the current diff.
  # ============================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown
          fail: true

  # ============================================================
  # Stage 2b: SAST — CodeQL
  # ============================================================
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      # CodeQL needs an actual compiled build to analyze Java bytecode/AST.
      - name: Build for CodeQL
        run: mvn -B compile -DskipTests

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  # ============================================================
  # Stage 2c: Dependency Vulnerability Scan
  # Java library CVEs are owned here (Snyk reads pom.xml).
  # Trivy in the docker-build stage only scans OS packages,
  # so there is no overlap between the two tools.
  # ============================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Run the CLI on the GitHub runner so Maven uses the JDK configured above.
      # The Docker-based snyk/actions/maven action receives the runner's JAVA_HOME,
      # whose host path is invalid inside its container.
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk dependency vulnerability scan (Maven)
        run: snyk test --severity-threshold=high --file=pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ============================================================
  # Stage 3: Docker Build + Container Image Scan (OS layer only)
  # ============================================================
  docker-build:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: [codeql, dependency-scan, secret-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true — build locally so Trivy can scan it before it goes anywhere
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: web-backend
          push: false
          load: true
          tags: expense-hub-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy DB cache — avoids re-downloading ~76MB every run.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/trivy
          key: cache-trivy-data-${{ runner.os }}-v1
          restore-keys: cache-trivy-data-${{ runner.os }}-

      - name: Trivy container image scan (OS packages only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: expense-hub-backend:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: '1'   # block deploy on unpatched CRITICAL OS CVEs
          vuln-type: os     # OS packages only; Java JAR CVEs handled by Snyk
          scanners: vuln    # skip secret scan (already done by TruffleHog job)
          cache: 'false'
          cache-dir: .cache/trivy

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/trivy
          key: cache-trivy-data-${{ runner.os }}-v1

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================
  # Stage 4: Deploy (main branch only, after image passes scan)
  # ============================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: expense-hub-production
      cancel-in-progress: false
    steps:
      - name: SSH deploy - update source and rebuild backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/huangqianer/ADprojectWeb
            git pull --ff-only origin main
            docker compose up -d --build web-backend
            docker compose ps

  # ============================================================
  # Stage 5: DAST — Dynamic Application Security Testing (OWASP ZAP)
  # This is a WEB-side DAST: ZAP probes the running Web backend API from
  # the outside (HTTP). It does not touch any database — the DB only needs
  # to exist so the app can boot.
  #
  # The backend wires two JPA datasources (primary web + mobile). For this
  # throwaway run we point BOTH at one disposable MySQL and set
  # ddl-auto=update, so Hibernate self-creates every table it validates —
  # no Mobile schema files needed. Nothing here uses the real Mobile DB.
  #
  # Non-blocking: baseline findings are for review, not a gate.
  # ============================================================
  dast:
    name: DAST (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Disposable MySQL — the app boots against it; ZAP never queries it.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: expense_hub_web
          MYSQL_ROOT_PASSWORD: dast_root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pdast_root_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: web-backend
          push: false
          load: true
          tags: expense-hub-backend:dast
          cache-from: type=gha

      # Both datasources point at the same disposable DB. ddl-auto=update
      # (overriding prod's 'validate') makes Hibernate create every table
      # both persistence units need — including the mobile 'approvals' table —
      # so no Mobile init.sql / schema seeding is required.
      - name: Start backend container
        run: |
          docker run -d --name backend-dast \
            --add-host=host.docker.internal:host-gateway \
            -p 8081:8081 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=3306 \
            -e DB_NAME=expense_hub_web \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=dast_root_pw \
            -e ENCRYPTION_SECRET="$(openssl rand -base64 32)" \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            -e MOBILE_API_BASE_URL=http://127.0.0.1:9 \
            -e MOBILE_DB_URL="jdbc:mysql://host.docker.internal:3306/expense_hub_web?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -e MOBILE_DB_USERNAME=root \
            -e MOBILE_DB_PASSWORD=dast_root_pw \
            expense-hub-backend:dast

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8081/api/health >/dev/null 2>&1; then
              echo "Backend is healthy"; exit 0
            fi
            echo "waiting for backend... ($i/40)"; sleep 5
          done
          echo "Backend failed to become healthy — dumping logs:"
          docker logs backend-dast
          exit 1

      - name: OWASP ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8081/api'
          fail_action: false
          allow_issue_writing: false

      - name: Show backend logs (always)
        if: always()
        run: docker logs backend-dast || true

      - name: Stop backend container
        if: always()
        run: docker rm -f backend-dast || true
