spring:
  application:
    name: web-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:expense_hub}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}

server:
  port: ${SERVER_PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:please-override-this-secret-in-real-environments-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  mobile:
    base-url: ${MOBILE_API_BASE_URL:http://host.docker.internal:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
