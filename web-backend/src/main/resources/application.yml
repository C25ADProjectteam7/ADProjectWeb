spring:
  application:
    name: web-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: native

app:
  encryption:
    secret: ${ENCRYPTION_SECRET}
  cors:
    # Comma-separated browser origins allowed to call this API. In production
    # set CORS_ALLOWED_ORIGINS to the gateway's own origin (e.g.
    # https://your-droplet-host); the default below is the Vite dev server.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:please-override-this-secret-in-real-environments-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  mobile:
    base-url: ${MOBILE_API_BASE_URL:http://host.docker.internal:8080}
    service-token: ${MOBILE_SERVICE_TOKEN:not-configured}

# Shared-SQL data source: the Manager approval workflow reads/writes the
# approvals table directly in Mobile's MySQL instance (see
# MobileDataSourceConfig). Defaults point at host.docker.internal:3307,
# which the mobile compose stack exposes on the server.
mobile:
  api:
    base-url: ${MOBILE_API_BASE_URL:http://localhost:8080}
    connect-timeout-ms: ${MOBILE_API_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${MOBILE_API_READ_TIMEOUT_MS:8000}
  datasource:
    url: ${MOBILE_DB_URL:jdbc:mysql://host.docker.internal:3307/mobile?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC}
    username: ${MOBILE_DB_USERNAME:root}
    password: ${MOBILE_DB_PASSWORD:changeme}

management:
  endpoints:
    web:
      exposure:
        include: health,info