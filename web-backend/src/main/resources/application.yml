spring:
  application:
    name: web-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:expense_hub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}

server:
  port: ${SERVER_PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:please-override-this-secret-in-real-environments-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  mobile:
    base-url: ${MOBILE_API_BASE_URL:http://host.docker.internal:8080}

    app:
      jwt:
        secret: ${JWT_SECRET:please-override-this-secret-in-real-environments-min-32-chars}
        expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      mobile:
        base-url: ${MOBILE_API_BASE_URL:http://host.docker.internal:8080}
        service-token: ${MOBILE_SERVICE_TOKEN:not-configured}

mobile:
  api:
    base-url: ${MOBILE_API_BASE_URL:http://localhost:8080}
    connect-timeout-ms: ${MOBILE_API_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${MOBILE_API_READ_TIMEOUT_MS:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
