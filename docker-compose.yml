version: '3.9'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 400m
    mem_reservation: 256m
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-buffer-pool-instances=1
      --innodb-log-file-size=32M
      --performance-schema=OFF
      --max-connections=50
      --table-open-cache=200
    environment:
      MYSQL_DATABASE: ${DB_NAME:-expense_hub}
      MYSQL_USER: ${DB_USERNAME:-expense_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  web-backend:
    build: ./web-backend
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 256m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-expense_hub}
      DB_USERNAME: ${DB_USERNAME:-expense_app}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env file}

      MOBILE_API_BASE_URL: ${MOBILE_API_BASE_URL:?set the accessible address of the Mobile backend in .env}
    networks: [internal]

  web-frontend:
    build: ./web-frontend
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    depends_on: [web-frontend, web-backend]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
