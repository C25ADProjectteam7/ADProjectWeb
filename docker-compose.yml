version: '3.9'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-expense_hub}
      MYSQL_USER: ${DB_USERNAME:-expense_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  web-backend:
    build: ./web-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-expense_hub}
      DB_USERNAME: ${DB_USERNAME:-expense_app}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?请在.env中设置JWT_SECRET}
    networks: [internal]
    # 不直接对外暴露端口，只能通过 gateway 访问

  web-frontend:
    build: ./web-frontend
    restart: unless-stopped
    networks: [internal]
    # 同上，不直接对外暴露端口

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web-frontend, web-backend]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
