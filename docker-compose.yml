version: '3.9'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 400m
    mem_reservation: 256m
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-buffer-pool-instances=1
      --innodb-log-file-size=32M
      --performance-schema=OFF
      --max-connections=50
      --table-open-cache=200
    environment:
      MYSQL_DATABASE: ${DB_NAME:-expense_hub}
      MYSQL_USER: ${DB_USERNAME:-expense_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  web-backend:
    build: ./web-backend
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 256m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-expense_hub}
      DB_USERNAME: ${DB_USERNAME:-expense_app}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

      MOBILE_API_BASE_URL: ${MOBILE_API_BASE_URL:?set MOBILE_API_BASE_URL in .env}

      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
    networks: [internal]

  web-frontend:
    build: ./web-frontend
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    depends_on: [web-frontend, web-backend]
    environment:
      # Address (host:port, no scheme) this Docker host can reach Mobile's
      # published port through — same value as web-backend's MOBILE_API_BASE_URL
      # host part. Required so the /mobile-uploads/ proxy in nginx.conf.template
      # has somewhere to point; container fails fast if it's not set in .env.
      MOBILE_UPSTREAM: ${MOBILE_UPSTREAM:?set MOBILE_UPSTREAM (host:port) in .env}
    volumes:
      # Mounted under templates/ (not conf.d/ directly) so the official nginx
      # image's entrypoint runs envsubst over it at startup and writes the
      # result to conf.d/default.conf — see nginx.conf.template's own comment.
      - ./gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - '80:80'
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
